<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · preto & branco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-icon">
                    <i class="fas fa-circle-notch"></i>
                </div>
                <h2 id="formTitle">Bem-vindo</h2>
                <p class="subtitle" id="formSubtitle">Acesse sua conta</p>
            </div>

            <form class="login-form" id="loginForm">
                <!-- Campo NOME (aparece só no cadastro) -->
                <div class="input-group" id="nomeGroup" style="display: none;">
                    <label for="nome">
                        <i class="fas fa-user"></i> Nome
                    </label>
                    <input type="text" id="nome" placeholder="Seu nome completo">
                </div>

                <div class="input-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="seu@email.com" required autofocus>
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" checked> Lembrar-me
                    </label>
                    <a href="#" class="forgot-link">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <i class="fas fa-arrow-right"></i> <span id="btnText">Entrar</span>
                </button>

                <p class="signup-text">
                    <span id="toggleText">Não tem conta?</span> 
                    <a href="#" id="toggleMode">Criar agora</a>
                </p>
            </form>

            <!-- Mensagem de feedback -->
            <div id="message" style="margin-top: 15px; text-align: center; font-size: 0.9rem;"></div>

            <div class="social-divider">
                <span>ou continue com</span>
            </div>
            <div class="social-buttons">
                <button class="social-btn"><i class="fab fa-google"></i></button>
                <button class="social-btn"><i class="fab fa-github"></i></button>
                <button class="social-btn"><i class="fab fa-linkedin-in"></i></button>
            </div>
        </div>

        <div class="login-footer">
            <p>© 2026 · design moderno</p>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÃO DA API
        // ============================================
const API_URL = 'https://super-space-waffle-4qjq75qp56vx259q-3000.app.github.dev/api/auth';

        // ============================================
        // ELEMENTOS DO DOM
        // ============================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const nomeInput = document.getElementById('nome');
        const nomeGroup = document.getElementById('nomeGroup');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const toggleText = document.getElementById('toggleText');
        const toggleMode = document.getElementById('toggleMode');
        const messageDiv = document.getElementById('message');

        let isLoginMode = true;

        // ============================================
        // TOGGLE MOSTRAR/ESCONDER SENHA
        // ============================================
        const toggleBtn = document.getElementById('togglePassword');
        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                const icon = this.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                }
            });
        }

        // ============================================
        // TOGGLE ENTRE LOGIN E CADASTRO
        // ============================================
        toggleMode.addEventListener('click', function(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;

            if (isLoginMode) {
                // Modo Login
                formTitle.textContent = 'Bem-vindo';
                formSubtitle.textContent = 'Acesse sua conta';
                btnText.textContent = 'Entrar';
                toggleText.textContent = 'Não tem conta?';
                toggleMode.textContent = 'Criar agora';
                nomeGroup.style.display = 'none';
                nomeInput.removeAttribute('required');
                messageDiv.innerHTML = '';
            } else {
                // Modo Cadastro
                formTitle.textContent = 'Criar conta';
                formSubtitle.textContent = 'Preencha os dados abaixo';
                btnText.textContent = 'Cadastrar';
                toggleText.textContent = 'Já tem conta?';
                toggleMode.textContent = 'Fazer login';
                nomeGroup.style.display = 'block';
                nomeInput.setAttribute('required', 'required');
                messageDiv.innerHTML = '';
            }
        });

        // ============================================
        // FUNÇÃO PARA MOSTRAR MENSAGENS
        // ============================================
        function showMessage(text, type = 'error') {
            messageDiv.innerHTML = text;
            messageDiv.style.color = type === 'success' ? '#28a745' : '#dc3545';
            messageDiv.style.fontWeight = '500';
            messageDiv.style.padding = '10px';
            messageDiv.style.borderRadius = '8px';
            messageDiv.style.backgroundColor = type === 'success' ? '#f0fff4' : '#fff5f5';
            messageDiv.style.border = type === 'success' ? '1px solid #28a745' : '1px solid #dc3545';
        }

        // ============================================
        // SUBMIT DO FORMULÁRIO
        // ============================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Limpar mensagem anterior
            messageDiv.innerHTML = '';
            
            // Desabilitar botão durante requisição
            submitBtn.disabled = true;
            const originalText = btnText.textContent;
            btnText.textContent = 'Aguarde...';
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + btnText.textContent;

            const email = emailInput.value.trim();
            const senha = passwordInput.value.trim();

            // Validação básica
            if (!email || !senha) {
                showMessage('Preencha todos os campos obrigatórios!', 'error');
                submitBtn.disabled = false;
                btnText.textContent = originalText;
                submitBtn.innerHTML = '<i class="fas fa-arrow-right"></i> ' + btnText.textContent;
                return;
            }

            if (!isLoginMode) {
                const nome = nomeInput.value.trim();
                if (!nome) {
                    showMessage('Preencha seu nome!', 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = originalText;
                    submitBtn.innerHTML = '<i class="fas fa-arrow-right"></i> ' + btnText.textContent;
                    return;
                }
            }

            try {
                // Montar requisição
                const endpoint = isLoginMode ? '/login' : '/register';
                const body = isLoginMode 
                    ? { email, senha }
                    : { nome: nomeInput.value.trim(), email, senha };

                const response = await fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (response.ok) {
                    // Sucesso!
                    if (isLoginMode) {
                        // Login bem-sucedido
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        showMessage('✅ Login realizado com sucesso!', 'success');
                        
                        // Redirecionar para dashboard após 1.5s
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    } else {
                        // Cadastro bem-sucedido
                        showMessage('✅ Cadastro realizado! Faça login para continuar.', 'success');
                        
                        // Limpar campos e mudar para login
                        nomeInput.value = '';
                        emailInput.value = '';
                        passwordInput.value = '';
                        
                        setTimeout(() => {
                            // Mudar para modo login
                            if (!isLoginMode) {
                                toggleMode.click();
                            }
                        }, 1500);
                    }
                } else {
                    // Erro da API
                    showMessage('❌ ' + (data.message || 'Erro na requisição'), 'error');
                }

            } catch (error) {
                console.error('Erro:', error);
                showMessage('❌ Erro de conexão com o servidor. Verifique se o backend está rodando.', 'error');
            }

            // Reativar botão
            submitBtn.disabled = false;
            btnText.textContent = originalText;
            submitBtn.innerHTML = '<i class="fas fa-arrow-right"></i> ' + btnText.textContent;
        });

        // ============================================
        // VERIFICAR SE USUÁRIO JÁ ESTÁ LOGADO
        // ============================================
        const token = localStorage.getItem('token');
        if (token) {
            fetch(API_URL + '/profile', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(res => {
                if (res.ok) {
                    return res.json();
                }
                throw new Error('Token inválido');
            })
            .then(user => {
                // Usuário já logado, redirecionar para dashboard
                window.location.href = 'dashboard.html';
            })
            .catch(() => {
                // Token inválido, limpar localStorage
                localStorage.removeItem('token');
                localStorage.removeItem('user');
            });
        }
    </script>
</body>
</html>
