<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .dashboard-card {
            background: #ffffff;
            border-radius: 2rem;
            padding: 3rem 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .avatar {
            font-size: 4rem;
            color: #111;
            background: #eaeaea;
            width: 100px;
            height: 100px;
            line-height: 100px;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .email {
            color: #5a5a5a;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .info-item {
            background: #f5f5f5;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .info-item .label {
            color: #5a5a5a;
        }

        .info-item .value {
            font-weight: 500;
            color: #111;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 1.5rem;
            width: 100%;
        }

        .btn-logout:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px -6px rgba(220, 53, 69, 0.3);
        }

        .btn-logout:active {
            transform: scale(0.97);
        }

        .loading {
            font-size: 1.2rem;
            color: #5a5a5a;
        }

        .fa-spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="dashboard-card" id="dashboard">
        <div class="avatar">
            <i class="fas fa-user-circle"></i>
        </div>
        <h1 id="userName">Carregando...</h1>
        <p class="email" id="userEmail">carregando@email.com</p>

        <div class="info-item">
            <span class="label"><i class="fas fa-id-badge"></i> ID</span>
            <span class="value" id="userId">---</span>
        </div>
        <div class="info-item">
            <span class="label"><i class="fas fa-calendar-alt"></i> Criado em</span>
            <span class="value" id="userCreated">---</span>
        </div>

        <button class="btn-logout" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Sair
        </button>
    </div>

    <script>
const API_URL = 'https://super-space-waffle-4qjq75qp56vx259q-3000.app.github.dev/api/auth';

        // Verificar token
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'index.html';
        }

        // Buscar perfil
        fetch(API_URL + '/profile', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
        .then(res => {
            if (!res.ok) {
                throw new Error('Token inválido');
            }
            return res.json();
        })
        .then(user => {
            document.getElementById('userName').textContent = user.nome;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userId').textContent = user.id;
            document.getElementById('userCreated').textContent = new Date(user.criado_em).toLocaleDateString('pt-BR');
        })
        .catch(() => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
