<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · preto & branco</title>
    <!-- CSS separado (linkado) -->
    <link rel="stylesheet" href="style.css">
    <!-- ícones (opcional, para um toque moderno) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- cabeçalho minimal -->
            <div class="login-header">
                <div class="brand-icon">
                    <i class="fas fa-circle-notch"></i>
                </div>
                <h2>Bem-vindo</h2>
                <p class="subtitle">Acesse sua conta</p>
            </div>

            <!-- formulário -->
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="seu@email.com" required autofocus>
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" checked> Lembrar-me
                    </label>
                    <a href="#" class="forgot-link">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-arrow-right"></i> Entrar
                </button>

                <p class="signup-text">
                    Não tem conta? <a href="#">Criar agora</a>
                </p>
            </form>

            <!-- rodapé com redes sociais (apenas estético) -->
            <div class="social-divider">
                <span>ou continue com</span>
            </div>
            <div class="social-buttons">
                <button class="social-btn"><i class="fab fa-google"></i></button>
                <button class="social-btn"><i class="fab fa-github"></i></button>
                <button class="social-btn"><i class="fab fa-linkedin-in"></i></button>
            </div>
        </div>

        <!-- pequeno rodapé informativo -->
        <div class="login-footer">
            <p>© 2026 · design moderno</p>
        </div>
    </div>

    <!-- JavaScript para toggle de senha (pequeno detalhe interativo) -->
    <script>
        (function() {
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    // troca ícone
                    const icon = this.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-eye');
                        icon.classList.toggle('fa-eye-slash');
                    }
                });
            }

            // prevenir submit real (apenas demonstração)
            const form = document.getElementById('loginForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    // simulação de feedback
                    const btn = this.querySelector('.btn-primary');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';
                    btn.disabled = true;
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        alert('Login simulado com sucesso! (design apenas)');
                    }, 1200);
                });
            }
        })();
    </script>
</body>
</html>
